[tool.poetry]
name = "docgraph"
version = "2.0.0"
description = "Local document RAG server for Cursor via MCP"
authors = ["DocGraph Contributors"]
readme = "README.md"
packages = [{ include = "docgraph" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pyyaml = "^6.0"
chromadb = "^1.5.9"
markitdown = { version = "^0.1.5", extras = ["all"] }
pymupdf = "^1.24"
fastapi = "^0.115"
python-multipart = "^0.0.20"
mcp = "^1.0"
openai = { version = "^2.8", optional = true }
crawl4ai = { version = "^0.8.6", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.25"
respx = "^0.22"
pytest-benchmark = "^4.0"

[tool.poetry.extras]
openai = ["openai"]
crawl = ["crawl4ai"]

[tool.poetry.scripts]
docgraph = "docgraph.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring Ollama or external services",
    "benchmark: performance baseline tests (uses pytest-benchmark)",
]
