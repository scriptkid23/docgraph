[tool.poetry]
name = "boostmcp"
version = "2.0.0"
description = "Local document RAG server for Cursor via MCP"
authors = ["BoostMCP Contributors"]
readme = "README.md"
packages = [{ include = "boostmcp" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pyyaml = "^6.0"
chromadb = "^1.5.9"
markitdown = { version = "^0.1.5", extras = ["all"] }
fastapi = "^0.115"
python-multipart = "^0.0.20"
mcp = "^1.0"
openai = { version = "^1.0", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.25"
respx = "^0.22"

[tool.poetry.extras]
openai = ["openai"]

[tool.poetry.scripts]
boostmcp = "boostmcp.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring Ollama or external services",
]
